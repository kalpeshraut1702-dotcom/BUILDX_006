<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="afterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="clampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <!-- Background Soil / Clean Trench Bedding -->
  <rect width="600" height="360" fill="url(#afterBg)"/>
  <rect x="0" y="0" width="600" height="70" fill="#0f172a"/>
  <line x1="0" y1="70" x2="600" y2="70" stroke="#10b981" stroke-width="4"/>

  <!-- Main Pipe (Drained & Cleaned) -->
  <rect x="30" y="160" width="540" height="70" rx="8" fill="#475569" stroke="#0f172a" stroke-width="3"/>

  <!-- Heavy Duty Ductile Iron Repair Sleeve Clamp (Installed over fractured section) -->
  <rect x="220" y="145" width="160" height="100" rx="8" fill="url(#clampGrad)" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="220" y1="195" x2="380" y2="195" stroke="#bae6fd" stroke-width="2"/>
  
  <!-- High Tensile Clamp Bolts -->
  <circle cx="245" cy="160" r="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <circle cx="245" cy="230" r="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <circle cx="300" cy="160" r="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <circle cx="300" cy="230" r="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <circle cx="355" cy="160" r="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <circle cx="355" cy="230" r="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>

  <!-- Hydrostatic Pressure Test Gauge -->
  <line x1="300" y1="145" x2="300" y2="105" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="300" cy="95" r="24" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
  <path d="M 288 102 A 16 16 0 1 1 312 102" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="300" y1="95" x2="310" y2="85" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
  <text x="300" y="108" fill="#15803d" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">2.5 BAR</text>

  <!-- Clean dry gravel base (no leak) -->
  <rect x="80" y="275" width="440" height="40" rx="6" fill="#334155" opacity="0.6"/>
  <text x="300" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Gravel Bedding &amp; Compaction Complete • Zero Seepage</text>

  <!-- Geotag & Technician Stamp -->
  <rect x="20" y="20" width="280" height="42" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#10b981" stroke-width="1.5"/>
  <text x="32" y="38" fill="#86efac" font-family="monospace" font-size="11" font-weight="bold">🔧 OCW Crew: Pravin Gaikwad</text>
  <text x="32" y="54" fill="#ffffff" font-family="monospace" font-size="10">DI Clamp 150mm Installed • Tested OK</text>

  <!-- Status Watermark Badge -->
  <rect x="410" y="20" width="170" height="34" rx="6" fill="#10b981"/>
  <text x="495" y="42" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✅ दुरुस्ती पूर्ण (REPAIRED)</text>
</svg>
