<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="holeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e24"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <!-- Asphalt Road Background -->
  <rect width="600" height="360" fill="url(#roadGrad)"/>
  
  <!-- Yellow Road Divider Strip -->
  <rect x="0" y="168" width="140" height="14" fill="#fbbf24" opacity="0.85"/>
  <rect x="220" y="168" width="160" height="14" fill="#fbbf24" opacity="0.85"/>
  <rect x="460" y="168" width="140" height="14" fill="#fbbf24" opacity="0.85"/>

  <!-- Road Texture & Cracks -->
  <path d="M 120 120 L 190 150 L 160 190 L 210 230" stroke="#475569" stroke-width="3" fill="none"/>
  <path d="M 380 90 L 410 140 L 460 170" stroke="#475569" stroke-width="2.5" fill="none"/>
  
  <!-- Massive Pothole Void -->
  <ellipse cx="300" cy="190" rx="140" ry="75" fill="url(#holeGrad)" stroke="#0f172a" stroke-width="4"/>
  <path d="M 180 180 Q 230 130 310 140 Q 410 135 430 185 Q 410 240 310 250 Q 200 245 180 180 Z" fill="#090d16"/>
  
  <!-- Deep Mud / Water Cavity inside Pothole -->
  <ellipse cx="300" cy="200" rx="90" ry="40" fill="url(#mudGrad)" opacity="0.85"/>
  
  <!-- Broken Asphalt Chunks & Rubble -->
  <polygon points="190,195 210,185 205,210" fill="#64748b"/>
  <polygon points="390,175 415,185 400,205" fill="#64748b"/>
  <polygon points="260,240 280,230 275,250" fill="#475569"/>
  <polygon points="340,245 365,235 355,255" fill="#475569"/>
  <polygon points="240,150 255,140 250,160" fill="#475569"/>

  <!-- Danger Hazard Warning Cone -->
  <polygon points="460,90 490,170 430,170" fill="#ea580c"/>
  <polygon points="450,115 470,115 475,130 445,130" fill="#ffffff"/>
  <polygon points="440,145 480,145 485,160 435,160" fill="#ffffff"/>
  <ellipse cx="460" cy="172" rx="35" ry="8" fill="#1e293b"/>

  <!-- Timestamp & Geotag Stamp -->
  <rect x="20" y="20" width="280" height="42" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="32" y="38" fill="#fef08a" font-family="monospace" font-size="11" font-weight="bold">📍 Dharampeth W-12 • West High Ct</text>
  <text x="32" y="54" fill="#ffffff" font-family="monospace" font-size="10">21.1415° N, 79.0624° E • PWD Tagged</text>

  <!-- Status Watermark Badge -->
  <rect x="420" y="20" width="160" height="34" rx="6" fill="#d97706"/>
  <text x="500" y="42" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🚧 खड्डा (POTHOLE)</text>
</svg>
