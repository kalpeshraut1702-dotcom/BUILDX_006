<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Background Wall & Ground -->
  <rect width="600" height="200" fill="url(#wallGrad)"/>
  <rect y="200" width="600" height="160" fill="url(#groundGrad)"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#334155" stroke-width="3"/>

  <!-- Overflowing NMC Municipal Dumpster / Green Bin -->
  <polygon points="120,130 320,130 295,270 145,270" fill="url(#binGrad)" stroke="#0f172a" stroke-width="3"/>
  <!-- Bin Rim -->
  <rect x="110" y="120" width="220" height="16" rx="4" fill="#14532d" stroke="#0f172a" stroke-width="2"/>
  <!-- Wheel -->
  <circle cx="160" cy="275" r="14" fill="#0f172a"/>
  <circle cx="160" cy="275" r="6" fill="#cbd5e1"/>
  <circle cx="280" cy="275" r="14" fill="#0f172a"/>
  <circle cx="280" cy="275" r="6" fill="#cbd5e1"/>

  <!-- NMC Swachh Bharat Logo on Bin -->
  <text x="215" y="195" fill="#f0fdf4" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NMC • SWM</text>
  <text x="215" y="215" fill="#bbf7d0" font-family="sans-serif" font-size="11" text-anchor="middle">स्वच्छ नागपूर</text>

  <!-- Overflowing Garbage Heap & Bags -->
  <path d="M 130 120 Q 180 50 230 70 Q 280 40 310 115 Z" fill="#475569"/>
  <!-- Mixed Trash Bags -->
  <circle cx="180" cy="90" r="28" fill="#1e293b"/>
  <circle cx="250" cy="80" r="32" fill="#0284c7" opacity="0.9"/>
  <circle cx="285" cy="100" r="24" fill="#eab308" opacity="0.9"/>

  <!-- Garbage Spill on Ground -->
  <ellipse cx="370" cy="260" rx="160" ry="50" fill="#334155" opacity="0.8"/>
  <circle cx="340" cy="250" r="25" fill="#0f172a"/>
  <circle cx="410" cy="260" r="22" fill="#e11d48" opacity="0.85"/>
  <circle cx="460" cy="270" r="18" fill="#0284c7" opacity="0.85"/>
  
  <!-- Discarded Plastic Bottles / Waste Items -->
  <rect x="360" y="280" width="30" height="10" rx="3" fill="#38bdf8" transform="rotate(25 360 280)"/>
  <rect x="420" y="240" width="35" height="12" rx="4" fill="#cbd5e1" transform="rotate(-15 420 240)"/>
  <polygon points="300,280 320,270 325,290 295,295" fill="#f59e0b"/>

  <!-- Timestamp & Geotag Stamp -->
  <rect x="20" y="20" width="280" height="42" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#10b981" stroke-width="1.5"/>
  <text x="32" y="38" fill="#bbf7d0" font-family="monospace" font-size="11" font-weight="bold">📍 Hanuman Nagar W-18 • Medical Sq</text>
  <text x="32" y="54" fill="#ffffff" font-family="monospace" font-size="10">21.1218° N, 79.0982° E • SWM Tagged</text>

  <!-- Status Watermark Badge -->
  <rect x="420" y="20" width="160" height="34" rx="6" fill="#15803d"/>
  <text x="500" y="42" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🗑️ कचरा साचणे (GARBAGE)</text>
</svg>
