<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Soil / Excavation trench -->
  <rect width="600" height="360" fill="url(#bgGrad)"/>
  <!-- Trench Depth Lines -->
  <path d="M0 80 Q 300 110 600 80 L 600 360 L 0 360 Z" fill="#2d3748" opacity="0.7"/>
  <!-- Asphalt Road Edge -->
  <rect x="0" y="0" width="600" height="70" fill="#1e293b"/>
  <line x1="0" y1="70" x2="600" y2="70" stroke="#f59e0b" stroke-width="4" stroke-dasharray="16,12"/>
  
  <!-- Main Cast Iron Water Pipeline 150mm -->
  <rect x="30" y="160" width="540" height="70" rx="8" fill="url(#pipeGrad)" stroke="#1e293b" stroke-width="3"/>
  <line x1="30" y1="175" x2="570" y2="175" stroke="#94a3b8" stroke-width="2" opacity="0.4"/>
  
  <!-- Collar Flanges -->
  <rect x="180" y="150" width="24" height="90" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <rect x="400" y="150" width="24" height="90" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Severe Pipe Fracture & Burst Crack -->
  <path d="M 285 160 L 295 190 L 280 205 L 305 230" stroke="#ef4444" stroke-width="6" fill="none" stroke-linecap="round"/>
  <polygon points="280,185 305,180 295,210 275,200" fill="#ef4444" opacity="0.6"/>
  
  <!-- Gushing Water Jet & Spray -->
  <path d="M 290 185 Q 260 100 240 70 Q 300 40 330 80 Q 310 130 300 185 Z" fill="url(#waterGrad)" opacity="0.85"/>
  <circle cx="250" cy="80" r="14" fill="#bae6fd" opacity="0.8"/>
  <circle cx="280" cy="55" r="10" fill="#e0f2fe" opacity="0.9"/>
  <circle cx="320" cy="70" r="12" fill="#7dd3fc" opacity="0.85"/>
  <circle cx="345" cy="100" r="8" fill="#38bdf8" opacity="0.7"/>
  
  <!-- Flooding Puddle at Base -->
  <ellipse cx="290" cy="300" rx="200" ry="35" fill="url(#waterGrad)" opacity="0.75"/>
  <ellipse cx="290" cy="300" rx="140" ry="20" fill="#7dd3fc" opacity="0.5"/>

  <!-- Timestamp & Geotag Stamp -->
  <rect x="20" y="20" width="280" height="42" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="32" y="38" fill="#fef08a" font-family="monospace" font-size="11" font-weight="bold">📍 Ashi Nagar W-24 • Kamptee Rd</text>
  <text x="32" y="54" fill="#ffffff" font-family="monospace" font-size="10">21.1852° N, 79.1154° E • GPS Tagged</text>

  <!-- Status Watermark Badge -->
  <rect x="420" y="20" width="160" height="34" rx="6" fill="#ef4444"/>
  <text x="500" y="42" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🚨 तीव्र गळती (BURST)</text>
</svg>
